server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolution du nom « api » au moment de la requête : nginx démarre même si l'API n'est pas encore prête.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Notifications push (ntfy) : abonnement en LECTURE SEULE au sujet secret d'un citoyen.
    # Seuls GET /notifications/kb-<32 hex>/json|sse passent : impossible de publier
    # (ntfy accepte aussi les publications par GET sur /<sujet>/publish, bloquées ici),
    # ni de lister les sujets. Connexion longue : pas de mise en tampon.
    location ~ "^/notifications/(?<sujet>kb-[a-f0-9]{32})/(?<flux>json|sse)$" {
        limit_except GET { deny all; }
        set $ntfy http://ntfy:80;
        proxy_pass $ntfy/$sujet/$flux$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /notifications/ {
        return 404;
    }

    # Fichiers compilés : nom unique par version, cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre adresse renvoie vers index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
