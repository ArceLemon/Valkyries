<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/kumabana-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a7ba2" />
    <title>KUMA BANA</title>
    <style>
      /* Écran de chargement affiché avant même que l'application se télécharge :
         il est remplacé par celui de React, qui a le même visuel. */
      body { margin: 0; }
      .splash-s {
        position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
        background: linear-gradient(135deg, #023e58 0%, #035c75 38%, #0a7ba2 70%, #3fb8e8 100%);
        color: #fff; font-family: system-ui, 'Segoe UI', sans-serif;
      }
      .splash-s .s-col { position: relative; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 0 24px; text-align: center; }
      .splash-s .s-marque {
        display: grid; place-items: center; width: 148px; height: 148px; border-radius: 36px; background: #fff;
        box-shadow: 0 0 0 10px rgba(255,255,255,.16), 0 24px 60px rgba(2,62,88,.45);
      }
      .splash-s .s-marque img { width: 108px; height: 108px; object-fit: contain; }
      .splash-s .s-titre { margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -.01em; }
      .splash-s .s-devise { margin: 0; max-width: 30ch; font-size: 18px; opacity: .9; }
      .splash-s .s-barre { position: relative; width: 220px; height: 6px; overflow: hidden; border-radius: 9999px; background: rgba(255,255,255,.25); }
      .splash-s .s-barre::before {
        content: ''; position: absolute; top: 0; bottom: 0; left: -45%; width: 45%; border-radius: 9999px;
        background: linear-gradient(90deg, #fcc304 0 34%, #eb1525 34% 67%, #12a150 67% 100%);
        animation: s-glisse 1.5s cubic-bezier(.65,0,.35,1) infinite;
      }
      @keyframes s-glisse { from { left: -45%; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { .splash-s .s-barre::before { animation: none; left: 0; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-s" role="status">
        <div class="s-col">
          <div class="s-marque"><img src="/src/assets/kumabana-mark.png" alt="" /></div>
          <p class="s-titre">KUMA BANA</p>
          <p class="s-devise">Une administration connectée, un citoyen au cœur</p>
          <div class="s-barre" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
